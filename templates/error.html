{% extends "base.html" %}

{% block title %}Error - JA4LookR{% endblock %}

{% block extra_css %}
<style>
    .error-container { text-align: center; padding: 60px 20px; }
    .error-title { font-size: 26px; color: var(--bad); margin-bottom: 12px; }
    .error-message { font-size: 15px; color: var(--muted); margin-bottom: 26px; }
    .error-box {
        background: var(--bad-bg); border: 1px solid var(--bad-bd); border-left-width: 3px;
        padding: 18px 20px; border-radius: 10px; margin: 24px auto; max-width: 600px; text-align: left;
    }
    .error-box h3 { color: #f2a3a8; margin-bottom: 8px; }
    .error-box p { color: var(--text-2); }
</style>
{% endblock %}

{% block content %}
<div class="error-container">
    <h1 class="error-title">{{ error }}</h1>
    <p class="error-message">{{ message }}</p>

    <div class="error-box">
        <h3>What happened?</h3>
        <p>{{ message }}</p>
    </div>

    <div style="margin-top: 36px;">
        <a href="/" class="btn">← Back to lookup</a>
    </div>
</div>
{% endblock %}
